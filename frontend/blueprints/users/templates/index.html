<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
</head>
<body>
    <h1>Liste des utilisateurs</h1>
    <ul>
        {% for user in users %}
        <li>{{ user.id }} - {{ user.name }}</li>
        {% else %}
        <li>Aucun utilisateur trouvé</li>
        {% endfor %}
    </ul>
</body>
</html>

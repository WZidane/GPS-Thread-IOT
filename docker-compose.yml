services:
  backend:
    build: ./backend
    container_name: flask_backend
    restart: unless-stopped
    ports:
      - "${BACK_PORT}:5001"
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - frontend_net
      - backend_net

  frontend:
    build: ./frontend
    container_name: flask_frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PORT}:5000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - frontend_net

  mongodb:
     image: mongo:latest
     container_name: mongo_db
     restart: unless-stopped
     volumes:
       - mongo_data:/data/db
     environment:
       - MONGO_INITDB_DATABASE=gps_thread_iot_db
       - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
       - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
     networks:
       - backend_net
  
volumes:
  mongo_data:
  
networks:
  frontend_net:
  backend_net:
    internal: true
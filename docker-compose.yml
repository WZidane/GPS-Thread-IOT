services:
  backend:
    build: ./backend
    container_name: flask_backend
    restart: unless-stopped
    ports:
      - "${BACK_PORT}:5001"
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - backend_net
      - iot_net

  frontend:
    build: ./frontend
    container_name: flask_frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PORT}:5000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - iot_net

  mongodb:
     image: mongo:latest
     container_name: mongo_db
     restart: unless-stopped
     volumes:
       - mongo_data:/data/db
     environment:
       - MONGO_INITDB_DATABASE=gps_thread_iot_db
       - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
       - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
     networks:
       - backend_net
       - iot_net

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    entrypoint: >
      sh -c "
      chown -R mosquitto: /mosquitto/data /mosquitto/log /mosquitto/config &&
      chmod -R 0700 /mosquitto/data &&
      exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      "
    networks:
      - iot_net
  
volumes:
  mongo_data:
  
networks:
  backend_net:
    internal: true
  iot_net: